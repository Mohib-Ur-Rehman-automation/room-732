<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room 732</title>
<style>
html,body{margin:0;height:100%;background:#06050a;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;color:#d8d4e6}
#wrap{position:relative;line-height:0}
canvas{display:block;border-radius:10px;box-shadow:0 0 0 2px #1c1827,0 0 0 9px #0c0a12,0 0 70px rgba(70,120,255,.10);outline:none}
#pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,5,10,.82);border-radius:10px;line-height:1.5}
#pause.on{display:flex}
.card{width:min(440px,84%);padding:22px 26px;border:1px solid #3a3350;background:#100d18;border-radius:8px;font-size:13px}
.card h2{margin:0 0 12px;font:italic 24px Georgia,"Times New Roman",serif;color:#9fe8f2;font-weight:normal}
.card label{display:flex;align-items:center;gap:12px;margin:8px 0}
.card label span{width:64px}
.card input{flex:1;accent-color:#7fdbe8}
.card table{border-collapse:collapse;margin:12px 0 14px;width:100%}
.card td{padding:2px 0;vertical-align:top}
.card td:first-child{color:#f0c66b;width:110px}
.card button{font:inherit;color:#06050a;background:#9fe8f2;border:0;border-radius:4px;padding:7px 16px;cursor:pointer}
.card button:focus-visible,canvas:focus-visible{outline:2px solid #f0c66b;outline-offset:2px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" tabindex="0" aria-label="Room 732, a keyboard game"></canvas>
<div id="pause"><div class="card">
<h2>Paused</h2>
<label><span>music</span><input id="vm" type="range" min="0" max="100" value="60" aria-label="Music volume"></label>
<label><span>sounds</span><input id="vs" type="range" min="0" max="100" value="70" aria-label="Sound volume"></label>
<table>
<tr><td>← →</td><td>walk (or drift, when you have no body)</td></tr>
<tr><td>↑</td><td>use a stair door · hold at door 732 to break it</td></tr>
<tr><td>hold ↓</td><td>brace against a shove</td></tr>
<tr><td>E</td><td>tether someone close (stand still)</td></tr>
<tr><td>1–5 / Tab</td><td>become a tethered body</td></tr>
<tr><td>P / M</td><td>pause / mute</td></tr>
</table>
<button id="resume">Resume</button>
</div></div>
</div>
<script>
(()=>{'use strict';
const W=1280,H=720,BX=150,BW=980,BR=BX+BW,FH=84,NF=7,BTOP=66;
const HL=BX+16,HR=BR-16,R732X=BR-180,XL=BX+90,XR=BR-90,DOORX=R732X-16;
const floorY=f=>BTOP+(NF-f+1)*FH,ceilY=f=>floorY(f)-FH+8;
const hallL=f=>HL,hallR=f=>f===7?R732X-10:HR;
const winL=f=>f>=2,winR=f=>f>=2&&f<=6;
const upX=f=>f%2?XR:XL,downX=f=>upX(f-1);
const T={PSPD:130,SHOVE_V:540,SLIDE_DEC:560,NPC_BRACE:.86,BIND_R:118,BIND_T:1.15,DOOR_T:5,FORCE_T:3.5,STAIR_T:1.4,TOTAL:100,DECAY:.09,WALK_TELL:2,
 KCD0:5.8,KCD1:3.1,MCD0:5.6,MCD1:2.7,LVLT:60,TRACK_CD:.6,PUP_T:9,PUP_GRIP:2.6,PUP_SPD:50};
const staffDoor=s=>s===3||s===5;
const MONO='ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace',SERIF='Georgia,"Times New Roman",serif';
let seed=(Date.now()>>>0)||7;
function rnd(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const rr=(a,b)=>a+rnd()*(b-a),pick=a=>a[Math.floor(rnd()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const vr=(a,b)=>a+Math.random()*(b-a);
const OUTFITS=['#c4566a','#3d98a0','#e0ad4a','#ece0c8','#5468b0','#9063a8','#d2743f','#6fa364','#b23645'];
const SKINS=['#f0c9a4','#d9a077','#a86f4a','#70482f'],HAIRS=['#1c1614','#4a2c1a','#8a5a2b','#c9b28a','#8d8d98'];
const WALLS=[0,'#3b3042','#2c4346','#4b3341','#3d4130','#2e3b55','#4c3b2c','#2b2b38'];

/* ───────── audio ───────── */
const AU={ctx:null,mv:.6,sv:.7,muted:false,next:0,step:0};
function initAudio(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{
 const C=new AC();AU.ctx=C;
 AU.comp=C.createDynamicsCompressor();AU.comp.threshold.value=-16;AU.comp.ratio.value=4;AU.comp.connect(C.destination);
 AU.master=C.createGain();AU.master.gain.value=.9;AU.master.connect(AU.comp);
 AU.mus=C.createGain();AU.mus.gain.value=AU.mv;AU.duck=C.createGain();AU.mus.connect(AU.duck);AU.duck.connect(AU.master);
 AU.sfx=C.createGain();AU.sfx.gain.value=AU.sv;AU.sfx.connect(AU.master);
 const d=C.createDelay(1);d.delayTime.value=.34;const fb=C.createGain();fb.gain.value=.3;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;
 AU.echo=C.createGain();AU.echo.gain.value=.45;AU.echo.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(AU.mus);
 const nb=C.createBuffer(1,C.sampleRate*1.5,C.sampleRate),ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;AU.nb=nb;
 // drone
 const dg=C.createGain();dg.gain.value=.028;const df=C.createBiquadFilter();df.type='lowpass';df.frequency.value=420;df.connect(dg);dg.connect(AU.mus);
 for(const f of [55,55.4,82.4]){const o=C.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(df);o.start()}
 AU.next=C.currentTime+.15;
 }catch(e){AU.ctx=null}
}
function tone(f,t,d,type,v,dest,o){o=o||{};const C=AU.ctx,os=C.createOscillator(),g=C.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
 if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.006));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 os.connect(g);g.connect(dest);if(o.echo)g.connect(AU.echo);os.start(t);os.stop(t+d+.05)}
function nz(t,d,v,ft,f0,f1,q){const C=AU.ctx,s=C.createBufferSource();s.buffer=AU.nb;s.loop=true;const fl=C.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f0,t);
 if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+d);fl.Q.value=q||.8;const g=C.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(fl);fl.connect(g);g.connect(AU.sfx);s.start(t,Math.random());s.stop(t+d+.05)}
function duck(){const g=AU.duck.gain,n=AU.ctx.currentTime;g.cancelScheduledValues(n);g.setTargetAtTime(.6,n,.02);g.setTargetAtTime(1,n+.25,.3)}
const ok=()=>AU.ctx&&!AU.muted;
const S={
 clack(){if(!ok())return;const t=AU.ctx.currentTime;nz(t,.03,.35,'highpass',2800);tone(170,t,.06,'square',.16,AU.sfx)},
 shove(){if(!ok())return;const t=AU.ctx.currentTime;duck();nz(t,.5,.55,'bandpass',260,2600,1);tone(72,t+.04,.35,'sine',.5,AU.sfx,{to:38})},
 glass(){if(!ok())return;const t=AU.ctx.currentTime;nz(t,.38,.4,'highpass',4200);for(let i=0;i<5;i++)tone(vr(2200,5200),t+vr(0,.12),vr(.08,.25),'sine',.07,AU.sfx)},
 hover(){if(!ok())return;const t=AU.ctx.currentTime;tone(900,t,.07,'sine',.12,AU.sfx);tone(1200,t+.08,.07,'sine',.12,AU.sfx)},
 grab(){if(!ok())return;const t=AU.ctx.currentTime;nz(t,.02,.3,'highpass',3500);tone(520,t,.14,'square',.16,AU.sfx,{to:150})},
 whiff(){if(!ok())return;const t=AU.ctx.currentTime;nz(t,.12,.14,'bandpass',1500,600,1.5)},
 slam(){if(!ok())return;const t=AU.ctx.currentTime;duck();tone(95,t,.45,'sine',.65,AU.sfx,{to:34});nz(t,.28,.45,'lowpass',900,180)},
 bindStart(){if(!ok())return;const t=AU.ctx.currentTime;tone(330,t,1.1,'sine',.1,AU.sfx,{to:660,a:.2})},
 bindDone(){if(!ok())return;const t=AU.ctx.currentTime;tone(660,t,.5,'sine',.16,AU.sfx);tone(990,t+.09,.6,'sine',.14,AU.sfx);tone(1320,t+.18,.7,'sine',.09,AU.sfx)},
 sw(){if(!ok())return;const t=AU.ctx.currentTime;tone(880,t,.2,'sine',.2,AU.sfx,{to:1320});tone(440,t,.25,'triangle',.12,AU.sfx,{to:660})},
 death(){if(!ok())return;const t=AU.ctx.currentTime;tone(233,t,.28,'triangle',.07,AU.sfx,{to:110})},
 unmoor(){if(!ok())return;const t=AU.ctx.currentTime;duck();tone(620,t,.9,'sine',.22,AU.sfx,{to:140});tone(310,t,.9,'triangle',.12,AU.sfx,{to:70})},
 seal(){if(!ok())return;const t=AU.ctx.currentTime;nz(t,.65,.24,'bandpass',2600,500,2);tone(140,t,.35,'sawtooth',.1,AU.sfx,{to:90})},
 raise(){if(!ok())return;const t=AU.ctx.currentTime;tone(58,t,1.2,'sawtooth',.14,AU.sfx,{to:118,a:.3});nz(t+.2,.5,.1,'bandpass',700,1400,6)},
 thud(){if(!ok())return;const t=AU.ctx.currentTime;tone(120,t,.22,'sine',.55,AU.sfx,{to:55});nz(t,.1,.3,'lowpass',700)},
 stairs(){if(!ok())return;const t=AU.ctx.currentTime;for(let i=0;i<3;i++)nz(t+i*.16,.06,.16,'lowpass',500)},
 deny(){if(!ok())return;const t=AU.ctx.currentTime;tone(160,t,.12,'square',.09,AU.sfx);tone(120,t+.1,.16,'square',.09,AU.sfx)},
 lvl(){if(!ok())return;const t=AU.ctx.currentTime;tone(98,t,.9,'sawtooth',.12,AU.sfx,{to:92});tone(147,t,.9,'sawtooth',.08,AU.sfx)},
 crash(){if(!ok())return;const t=AU.ctx.currentTime;nz(t,.9,.6,'highpass',2500);tone(80,t,.8,'sine',.7,AU.sfx,{to:30});for(let i=0;i<9;i++)tone(vr(1800,6000),t+vr(0,.4),vr(.1,.5),'sine',.07,AU.sfx)},
 lose(){if(!ok())return;const t=AU.ctx.currentTime;tone(196,t,1.4,'triangle',.2,AU.sfx,{to:98});tone(147,t+.3,1.4,'triangle',.16,AU.sfx,{to:73})}
};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[{b:45,t:[57,60,64]},{b:41,t:[57,60,65]},{b:38,t:[57,62,65]},{b:40,t:[56,59,64]},{b:45,t:[57,60,64]},{b:36,t:[55,60,64]},{b:38,t:[57,62,65]},{b:40,t:[56,62,64]}];
const MEL=[[76,0,0,72,0,69],[77,0,76,0,72,0],[74,0,0,77,0,74],[71,0,68,0,71,76],[81,0,0,76,0,72],[79,0,76,0,72,0],[77,0,74,0,69,0],[68,0,71,0,64,0]];
const ARP=[0,2,1,2,0,1];
function box(n,t,v){const f=mtof(n);tone(f,t,1.2,'sine',v,AU.mus,{echo:true});tone(f*3.01,t,.3,'sine',v*.16,AU.mus);tone(f*2,t,.55,'triangle',v*.1,AU.mus)}
function music(){
 if(!AU.ctx)return;const C=AU.ctx;if(AU.next<C.currentTime-.5)AU.next=C.currentTime+.05;
 const play=G&&ST==='play',L=play?G.lvl:0,bpm=play?86+L*6:74,sd=60/bpm/2;
 while(AU.next<C.currentTime+.16){const s=AU.step,t=AU.next,bar=Math.floor(s/6)%8,k=s%6,ch=PROG[bar],cyc=Math.floor(s/48)%2;
  if(!AU.muted){
   if(k===0)tone(mtof(ch.b),t,sd*5,'triangle',.2,AU.mus);
   if(k===2||k===4)for(const n of ch.t)tone(mtof(n),t,sd*1.5,'triangle',.032,AU.mus);
   if(cyc===0||L>=3)box(ch.t[ARP[k]]+12,t,.05);
   if((cyc===1||L>=2)&&MEL[bar][k]&&Math.random()>.12)box(MEL[bar][k],t,.085);
   if(L>=4&&k%2===0){tone(k===0?2400:3200,t,.03,'square',.012,AU.mus)}
   if(L>=6&&(k===0||k===1))tone(52,t,.16,'sine',.2,AU.mus,{to:40});
  }
  AU.next+=sd;AU.step++}
}

/* ───────── state ───────── */
let G=null,ST='title',nid=1,introI=0,stT=0,overWhy='';
const B={};
function mkPerson(f,x){const kind=rnd()<.12?3:Math.floor(rnd()*3);return{id:nid++,f,x,dir:rnd()<.5?-1:1,alive:true,state:'wander',t:rr(0,3),tx:x,go:false,stairTo:0,spd:rr(30,48),ph:rnd()*6.28,
 brace:false,braceT:0,stun:0,slide:0,bump:0,stair:null,slot:-1,held:0,holder:null,grab:false,gx:0,gy:0,panic:0,
 look:{c:kind===3?'#a3202c':pick(OUTFITS),skin:pick(SKINS),hair:pick(HAIRS),kind,hat:kind===3||rnd()<.16}}}
function resetBoy(){Object.assign(B,{cx:BR-90,cy:ceilY(7)+34,m:'idle',mcd:7,kcd:5,k:null,tgt:null,tf:1,tx:0,ht:0,hT:1,vic:null,wx:640,wy:300,wt:0,glyph:'arrow',lit:{},obj:null,ph:0,slam:false,side:1,ly:0})}
function newGame(cp){
 G={time:cp?cp.time:0,people:[],corpses:[],puppets:[],props:[],fallers:[],parts:[],objs:[],slots:[null,null,null,null,null],active:null,wisp:null,bind:null,
  focus:{f:1,x:640,conf:0},walkT:0,walkDir:0,maxFloor:cp?cp.floor:1,cp:cp||{floor:1,alive:T.TOTAL,time:0},seals:{},win:{},force:{},open:{},stats:{},unmoored:0,door:0,bashT:0,doorShake:0,shake:0,slow:0,
  caps:[],cap:null,notes:[],note:null,seen:{},lvl:1,worn:0,switchCd:0,total:T.TOTAL,alive:0,flash:0,strug:0,endT:0,cracks:[],prompt:null,foundCd:0};
 for(let f=1;f<=NF;f++)G.win[f]={L:true,R:true};
 const n=cp?cp.alive:T.TOTAL,wts=[22,14,14,14,14,14,8];
 for(let i=0;i<n;i++){let r=rnd()*100,f=1;for(let j=0;j<7;j++){r-=wts[j];if(r<=0){f=j+1;break}}G.people.push(mkPerson(f,rr(hallL(f)+70,hallR(f)-70)))}
 for(let f=1;f<=NF;f++){const k=f===7?2:3+Math.floor(rnd()*2);for(let i=0;i<k;i++)G.props.push({f,x:rr(hallL(f)+110,hallR(f)-110),type:pick(['plant','cart','table','plant']),slide:0})}
 resetBoy();
 if(cp&&cp.floor>1){const p=G.people[0];p.f=cp.floor;p.x=downX(cp.floor);setActive(p);G.lvl=clamp(Math.max(G.maxFloor,1+Math.floor(G.time/T.LVLT)),1,7);B.kcd=3;B.mcd=4;note('Floor '+cp.floor+'. Again.')}
 else{G.corpses.push({x:640,f:1,look:{c:'#8b8794',skin:'#cfc6c0',hair:'#2a2428',kind:0,hat:false},slide:0,dir:1});G.wisp={x:640,y:floorY(1)-20,t:10};
  cap('> oops.');note('← →  drift. Fall into someone living.',5)}
 G.alive=G.people.length;
}
function cap(s){G.caps.push(s)}
function note(s,d){G.notes.push({s,d:d||3.2})}
function countAlive(){let n=0;for(const p of G.people)if(p.alive)n++;return n}
function notice(f,x,c){const F=G.focus;if(c>=F.conf){if(F.conf<.3&&c>=.6&&G.foundCd<=0){cap(pick(['> there you are.','> found you.','> hold still.','> i see you in there.']));G.foundCd=9}F.f=f;F.x=x;F.conf=c}}
function setActive(p){const prev=G.active;if(prev&&prev.alive&&prev!==p)prev.state='tether';G.active=p;
 if(p.slot<0){const i=G.slots.indexOf(null);p.slot=i;G.slots[i]=p}
 p.state='active';p.brace=false;p.panic=0;p.go=false;G.worn++;G.flash=.3;G.walkT=0;soulBurst(p.x,floorY(p.f)-18,14);
 if(p.f>G.maxFloor)floorReached(p.f)}
function floorReached(f){if(f>G.maxFloor){G.maxFloor=f;G.cp={floor:f,alive:countAlive(),time:G.time}}}
function soulBurst(x,y,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:vr(-60,60),vy:vr(-90,20),life:vr(.4,.9),col:'#9fe8f2',size:vr(1.2,2.6),grav:-30})}
function dust(x,y,n){for(let i=0;i<n;i++)G.parts.push({x:x+vr(-16,16),y,vx:vr(-90,90),vy:vr(-70,-10),life:vr(.3,.8),col:'#b9ad9e',size:vr(1.5,3.5),grav:160})}
function breakWin(f,side){const w=G.win[f];if(!w[side])return;w[side]=false;S.glass();const x=side==='L'?BX+6:BR-6;
 for(let i=0;i<22;i++)G.parts.push({x,y:vr(ceilY(f)+10,floorY(f)-6),vx:(side==='L'?-1:1)*vr(40,260),vy:vr(-120,40),life:vr(.5,1.2),col:Math.random()<.5?'#d6f3ff':'#8fc7e0',size:vr(1.5,3.5),grav:420})}
function faller(x,y,side,look,kind){G.fallers.push({x,y,vx:side*vr(70,170),vy:-vr(10,80),rot:0,vrot:vr(-7,7),look,kind:kind||'p',t:0,land:false})}

function slideO(o,dt){if(!o.slide)return false;o.x+=o.slide*dt;const s=Math.sign(o.slide);o.slide-=s*T.SLIDE_DEC*dt;if(Math.sign(o.slide)!==s)o.slide=0;
 const L=hallL(o.f)+2,R=hallR(o.f)-2;
 if(o.x<L){if(winL(o.f)&&Math.abs(o.slide)>60){breakWin(o.f,'L');return -1}o.x=L;o.bump=Math.abs(o.slide);o.slide=0}
 else if(o.x>R){if(winR(o.f)&&Math.abs(o.slide)>60){breakWin(o.f,'R');return 1}o.x=R;o.bump=Math.abs(o.slide);o.slide=0}
 return false}
function slideP(p,dt){const out=slideO(p,dt);if(out){faller(out<0?BX-6:BR+6,floorY(p.f)-18,out,p.look);kill(p,'fall',false);return true}
 if(p.bump>150){p.stun=Math.max(p.stun,1.1);dust(p.x,floorY(p.f)-4,4)}p.bump=0;return false}
function kill(p,why,corpse,px,py){
 if(!p.alive)return;p.alive=false;G.stats[why]=(G.stats[why]||0)+1;const x=px===undefined?p.x:px,y=py===undefined?floorY(p.f)-18:py;
 if(corpse)G.corpses.push({x:p.x,f:p.f,look:p.look,slide:0,dir:p.dir});
 if(p.holder){p.holder.grip=null;p.holder=null}
 if(G.bind&&(G.bind.a===p||G.bind.b===p))cancelBind();
 for(const q of G.people)if(q.alive&&q.f===p.f&&q.slot<0&&q.state==='wander'&&!q.stair&&Math.abs(q.x-p.x)<170){q.panic=rr(1,2.2);q.dir=q.x<p.x?-1:1;q.brace=false;q.go=false}
 S.death();
 if(p.slot>=0){G.slots[p.slot]=null;p.slot=-1;if(G.active===p)activeDied(x,y);else{note('A tether snaps.');soulBurst(x,y,8)}}
}
function activeDied(x,y){G.active=null;G.walkT=0;let best=null,bd=1e9;
 for(const q of G.slots)if(q&&q.alive&&!q.grab){const d=Math.hypot(q.x-x,floorY(q.f)-y);if(d<bd){bd=d;best=q}}
 if(best){setActive(best);G.slow=.8;S.sw();note('You slip into another.');notice(best.f,best.x,.7)}
 else{for(let i=0;i<5;i++){const q=G.slots[i];if(q){q.slot=-1;q.state='wander';G.slots[i]=null}}
  G.unmoored++;G.wisp={x:clamp(x,HL,HR),y:Math.min(y,floorY(1)-20),t:5};G.focus.conf=0;S.unmoor();G.slow=.6;note('Unmoored. You sink. ← → drift into someone.',4.5);if(!G.seen.un){G.seen.un=1;cap('> ...where did you go.')}}}

/* ───────── player ───────── */
function cancelBind(){if(!G.bind)return;const b=G.bind.b;if(b.alive&&b.state==='transfixed'){b.state='wander';b.t=.4}G.bind=null}
function startBind(p){if(G.bind)return;if(G.slots.indexOf(null)<0){note('Five is all a soul can hold.');S.deny();return}
 let best=null,bd=T.BIND_R;const py=floorY(p.f)-18;
 for(const q of G.people)if(q.alive&&q.slot<0&&!q.stair&&!q.grab&&q!==p){const d=Math.hypot(q.x-p.x,floorY(q.f)-18-py);if(d<bd){bd=d;best=q}}
 if(!best){note('No one close enough.');S.deny();return}
 G.bind={a:p,b:best,t:0};best.state='transfixed';best.brace=false;best.panic=0;best.go=false;S.bindStart()}

 const a=G.alive,rank=a>=70?'Hardly anyone will believe what they saw.':a>=45?'They will not speak of it. They will not forget it.':a>=20?'Too few. But they are breathing, and he is not playing.':a>1?'A handful. Each of them carried you a little way.':'The last one standing was enough.';
 c.fillStyle='#f0c66b';c.font='italic 18px '+SERIF;c.fillText(rank,W/2,330);
 const m=Math.floor(G.time/60),s=Math.floor(G.time%60);c.fillStyle='#8d86a3';c.font='13px '+MONO;c.fillText('survivors '+G.alive+' / '+G.total+'     time '+m+':'+String(s).padStart(2,'0')+'     bodies worn '+G.worn,W/2,390);
 if(stT>2){c.fillStyle='#fff';c.font='bold 13px '+MONO;c.fillText('ENTER  another night',W/2,460)}c.globalAlpha=1}

/* ───────── input & loop ───────── */
const K={},P={};let focused=false,SC=1,paused=false;
K_UP=()=>!!(K.ArrowUp||K.w);K_MV=()=>!!(K.ArrowLeft||K.ArrowRight||K.a||K.d);
function readInput(){return{left:K.ArrowLeft||K.a,right:K.ArrowRight||K.d,up:K.ArrowUp||K.w,down:K.ArrowDown||K.s,use:P.ArrowUp||P.w,bind:P.e||P[' '],
 sw:[P['1'],P['2'],P['3'],P['4'],P['5']],tab:P.Tab||P.q,lp:P.ArrowLeft||P.a,rp:P.ArrowRight||P.d}}
const pauseEl=document.getElementById('pause');
function setPause(v){if(ST!=='play'&&v)return;paused=v;pauseEl.classList.toggle('on',v);if(v)document.getElementById('resume').focus();else cv.focus()}
function uiKey(k){
 if(k==='m'){AU.muted=!AU.muted;if(AU.master)AU.master.gain.value=AU.muted?0:.9;return}
 if(ST==='title'){if(k==='Enter'){ST='intro';introI=0;stT=0}}
 else if(ST==='intro'){if(k==='Enter'||k===' '){if(stT*46<CARDS[introI].length)stT=99;else if(++introI>=CARDS.length){newGame();ST='play'}else stT=0}else if(k==='Escape'){newGame();ST='play'}}
 else if(ST==='play'){if(k==='p'||k==='Escape')setPause(!paused)}
 else if(ST==='over'){if(stT>.8){if(k==='Enter'){newGame(G.cp.floor>1?G.cp:null);ST='play'}else if(k==='r'){newGame();ST='play'}}}
 else if(ST==='won'){if(k==='Enter'&&stT>2){newGame();ST='title'}}}
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(e.target&&e.target.tagName==='INPUT')return;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Tab'].includes(e.key)&&!paused)e.preventDefault();
 if(e.repeat)return;initAudio();focused=true;if(!K[k])P[k]=true;K[k]=true;uiKey(k)});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;K[k]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;if(ST==='play')setPause(true)});
cv.addEventListener('pointerdown',()=>{initAudio();focused=true;cv.focus()});
document.getElementById('resume').addEventListener('click',()=>setPause(false));
document.getElementById('vm').addEventListener('input',e=>{AU.mv=e.target.value/100;if(AU.mus)AU.mus.gain.value=AU.mv});
document.getElementById('vs').addEventListener('input',e=>{AU.sv=e.target.value/100;if(AU.sfx)AU.sfx.gain.value=AU.sv;S.clack()});
function resize(){const iw=window.innerWidth-24,ih=window.innerHeight-24,cw=Math.max(320,Math.min(iw,ih*16/9)),dpr=Math.min(window.devicePixelRatio||1,2);
 cv.style.width=cw+'px';cv.style.height=cw*9/16+'px';cv.width=Math.round(cw*dpr);cv.height=Math.round(cw*9/16*dpr);SC=cv.width/W;slPat=null}
addEventListener('resize',resize);
let last=0;
function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;stT+=dt;
 if(!paused){if(ST==='play')step(dt,readInput());
  if(ST==='ending'){G.endT+=dt;if(G.endT>4.6){ST='won';stT=0}}
  fx(dt)}
 for(const k in P)P[k]=false;music();render(now);requestAnimationFrame(frame)}
window.__game={get G(){return G},B,T,step,fx,newGame,render,C:{floorY,upX,downX,hallL,hallR,DOORX,R732X,ceilY},get ST(){return ST},set ST(v){ST=v},seed:v=>{seed=v}};
buildStatic();resize();newGame();ST='title';requestAnimationFrame(frame);
})();
</script>
